services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest

    environment:
      PUID: "${PUID}"
      PGID: "${PGID}"
      TZ: "${TZ}"
      UMASK: "${UMASK:-002}"

    volumes:
      - ./config/sonarr:/config
      - ./data:/data

    ports:
      - "8989:8989"

    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest

    environment:
      PUID: "${PUID}"
      PGID: "${PGID}"
      TZ: "${TZ}"
      UMASK: "${UMASK:-002}"

    volumes:
      - ./config/radarr:/config
      - ./data:/data

    ports:
      - "7878:7878"

    restart: unless-stopped

  gluetun:
    image: qmcgaw/gluetun:latest

    cap_add:
      - NET_ADMIN

    devices:
      - /dev/net/tun:/dev/net/tun

    environment:
      TZ: "${TZ}"
      VPN_SERVICE_PROVIDER: "private internet access"
      VPN_TYPE: "openvpn"
      OPENVPN_USER: "${PIA_OPENVPN_USER}"
      OPENVPN_PASSWORD: "${PIA_OPENVPN_PASSWORD}"
      OPENVPN_PROTOCOL: "${PIA_OPENVPN_PROTOCOL:-udp}"
      SERVER_REGIONS: "${PIA_SERVER_REGIONS:-}"
      PORT_FORWARD_ONLY: "${PIA_PORT_FORWARD_ONLY:-true}"
      VPN_PORT_FORWARDING: "${PIA_VPN_PORT_FORWARDING:-on}"
      FIREWALL_INPUT_PORTS: "8080"

      # When PIA assigns a forwarded port, keep qBittorrent's listening port in
      # sync. qBittorrent shares Gluetun's network namespace, so localhost is
      # the correct address here. Localhost authentication bypass is enabled by
      # scripts/configure-qbittorrent.sh solely for this hook.
      VPN_PORT_FORWARDING_UP_COMMAND: >-
        /bin/sh -c 'wget -O /dev/null -q --retry-connrefused
        --post-data "json={\"listen_port\":{{PORT}},\"current_network_interface\":\"{{VPN_INTERFACE}}\",\"random_port\":false,\"upnp\":false}"
        http://127.0.0.1:8080/api/v2/app/setPreferences'
      VPN_PORT_FORWARDING_DOWN_COMMAND: >-
        /bin/sh -c 'wget -O /dev/null -q --retry-connrefused
        --post-data "json={\"listen_port\":0,\"current_network_interface\":\"lo\"}"
        http://127.0.0.1:8080/api/v2/app/setPreferences'

    volumes:
      - ./config/gluetun:/gluetun

    # qBittorrent has no ports or independent Docker network of its own. The
    # WebUI is deliberately published through Gluetun instead. Torrent peer
    # traffic exits through the VPN interface and the VPN provider's forwarded
    # port, not a host-side Docker mapping.
    ports:
      - "8080:8080"

    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest

    network_mode: "service:gluetun"

    depends_on:
      - gluetun

    environment:
      PUID: "${PUID}"
      PGID: "${PGID}"
      TZ: "${TZ}"
      UMASK: "${UMASK:-002}"
      WEBUI_PORT: "8080"
      TORRENTING_PORT: "${QBITTORRENT_TORRENT_PORT:-6881}"

    volumes:
      - ./config/qbittorrent:/config
      - ./data:/data

    stop_grace_period: 10s
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest

    environment:
      PUID: "${PUID}"
      PGID: "${PGID}"
      TZ: "${TZ}"

    volumes:
      - ./config/prowlarr:/config

    ports:
      - "9696:9696"

    restart: unless-stopped

  file-security:
    image: ghcr.io/haydeproductions/file-security-manager:0.1.0
    restart: unless-stopped

    # FileSecurityManager itself runs as UID/GID 10001. qBittorrent creates
    # completed downloads using PGID and a group-writable umask, so granting
    # that PGID as a supplementary group lets the security service remove or
    # quarantine files without changing its image user.
    group_add:
      - "${PGID}"

    volumes:
      - ./file-security/config.yaml:/etc/file-security/config.yaml:ro
      # Mount only completed Sonarr/Radarr trees. Incomplete downloads are not
      # exposed to FileSecurityManager.
      - ./data/downloads/tv:/data/tv
      - ./data/downloads/movies:/data/movies
      - file-security-quarantine:/quarantine
      - file-security-logs:/logs
      - file-security-mirrors:/mirrors

    # qBittorrent already occupies host port 8080. Keep FileSecurityManager's
    # host-side test endpoint local-only on 8081; containers use port 8080.
    ports:
      - "127.0.0.1:${FILE_SECURITY_HOST_PORT:-8081}:8080"

  coordinator:
    # The coordinator is intentionally profile-gated so a plain `docker compose up`
    # cannot start imports before first-run configuration has completed. `run.sh`
    # explicitly starts this service only after all configuration verifies.
    profiles: ["runtime"]

    build:
      context: ./coordinator
    restart: unless-stopped
    user: "${PUID}:${PGID}"

    depends_on:
      - sonarr
      - radarr
      - qbittorrent
      - gluetun
      - file-security

    environment:
      QBITTORRENT_URL: "http://gluetun:8080"
      QBITTORRENT_USERNAME: "${QBITTORRENT_USERNAME}"
      QBITTORRENT_PASSWORD: "${QBITTORRENT_PASSWORD}"
      QBITTORRENT_SONARR_CATEGORY: "${QBITTORRENT_SONARR_CATEGORY:-sonarr}"
      QBITTORRENT_SONARR_CATEGORY_PATH: "${QBITTORRENT_SONARR_CATEGORY_PATH:-/data/downloads/tv}"
      QBITTORRENT_RADARR_CATEGORY: "${QBITTORRENT_RADARR_CATEGORY:-radarr}"
      QBITTORRENT_RADARR_CATEGORY_PATH: "${QBITTORRENT_RADARR_CATEGORY_PATH:-/data/downloads/movies}"
      QBITTORRENT_COMPLETED_ROOT: "/data/downloads"

      FILE_SECURITY_URL: "http://file-security:8080"
      FILE_SECURITY_SAFE_STATES: "${FILE_SECURITY_SAFE_STATES:-SAFE}"
      FILE_SECURITY_BLOCK_STATES: "${FILE_SECURITY_BLOCK_STATES:-}"

      SONARR_URL: "http://sonarr:8989"
      SONARR_CONFIG_FILE: "/sonarr-config/config.xml"
      SONARR_IMPORT_MODE: "${SONARR_IMPORT_MODE:-copy}"

      RADARR_URL: "http://radarr:7878"
      RADARR_CONFIG_FILE: "/radarr-config/config.xml"
      RADARR_IMPORT_MODE: "${RADARR_IMPORT_MODE:-copy}"

      DOWNLOADS_MOUNT: "/downloads"
      COORDINATOR_STATE_FILE: "/state/state.json"
      COORDINATOR_POLL_INTERVAL_SECONDS: "${COORDINATOR_POLL_INTERVAL_SECONDS:-10}"
      COORDINATOR_HTTP_TIMEOUT_SECONDS: "${COORDINATOR_HTTP_TIMEOUT_SECONDS:-20}"
      QBITTORRENT_AUTH_RETRY_SECONDS: "${QBITTORRENT_AUTH_RETRY_SECONDS:-300}"
      COORDINATOR_DRY_RUN: "${COORDINATOR_DRY_RUN:-false}"

    volumes:
      - ./config/sonarr:/sonarr-config:ro
      - ./config/radarr:/radarr-config:ro
      - ./data/downloads:/downloads:ro
      - ./runtime/coordinator:/state

volumes:
  file-security-quarantine:
  file-security-logs:
  file-security-mirrors:
