x-linuxserver-environment: &linuxserver-environment
  PUID: "${PUID}"
  PGID: "${PGID}"
  TZ: "${TZ}"
  UMASK: "${UMASK:-002}"

services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    environment:
      <<: *linuxserver-environment
    volumes:
      - ./state/sonarr:/config
      - ./data:/data
    ports:
      - "8989:8989"
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    environment:
      <<: *linuxserver-environment
    volumes:
      - ./state/radarr:/config
      - ./data:/data
    ports:
      - "7878:7878"
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    environment:
      <<: *linuxserver-environment
    volumes:
      - ./state/prowlarr:/config
    ports:
      - "9696:9696"
    restart: unless-stopped

  gluetun:
    image: qmcgaw/gluetun:latest
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TZ: "${TZ}"
      VPN_SERVICE_PROVIDER: "private internet access"
      VPN_TYPE: "openvpn"
      OPENVPN_USER: "${PIA_OPENVPN_USER}"
      OPENVPN_PASSWORD: "${PIA_OPENVPN_PASSWORD}"
      OPENVPN_PROTOCOL: "${PIA_OPENVPN_PROTOCOL:-udp}"
      SERVER_REGIONS: "${PIA_SERVER_REGIONS:-}"
      PORT_FORWARD_ONLY: "${PIA_PORT_FORWARD_ONLY:-true}"
      VPN_PORT_FORWARDING: "${PIA_VPN_PORT_FORWARDING:-on}"
      FIREWALL_INPUT_PORTS: "8080"

      # qBittorrent shares Gluetun's network namespace. Keep its incoming
      # torrent port synchronized with PIA's dynamically assigned forwarded port.
      VPN_PORT_FORWARDING_UP_COMMAND: >-
        /bin/sh -c 'wget -O /dev/null -q --retry-connrefused
        --post-data "json={\"listen_port\":{{PORT}},\"current_network_interface\":\"{{VPN_INTERFACE}}\",\"random_port\":false,\"upnp\":false}"
        http://127.0.0.1:8080/api/v2/app/setPreferences'
      VPN_PORT_FORWARDING_DOWN_COMMAND: >-
        /bin/sh -c 'wget -O /dev/null -q --retry-connrefused
        --post-data "json={\"listen_port\":0,\"current_network_interface\":\"lo\"}"
        http://127.0.0.1:8080/api/v2/app/setPreferences'
    volumes:
      # Gluetun legitimately needs elevated networking privileges. Keep its
      # writable state in Docker-managed storage so it cannot create root-owned
      # files inside the project checkout.
      - gluetun-state:/gluetun
    ports:
      # qBittorrent's WebUI is published through Gluetun; qBittorrent itself
      # deliberately has no host ports and no independent Docker network.
      - "8080:8080"
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      <<: *linuxserver-environment
      WEBUI_PORT: "8080"
      TORRENTING_PORT: "${QBITTORRENT_TORRENT_PORT:-6881}"
    volumes:
      - ./state/qbittorrent:/config
      - ./data:/data
    stop_grace_period: 10s
    restart: unless-stopped

  file-security:
    image: ghcr.io/haydeproductions/file-security-manager:0.1.0
    restart: unless-stopped
    # The image runs as UID/GID 10001. Supplementary PGID plus setgid/group-
    # writable download directories lets it quarantine/remove completed files
    # without changing the image user or making project files root-owned.
    group_add:
      - "${PGID}"
    volumes:
      - ./config/file-security/config.yaml:/etc/file-security/config.yaml:ro
      - ./data/downloads/tv:/data/tv
      - ./data/downloads/movies:/data/movies
      - file-security-quarantine:/quarantine
      - file-security-logs:/logs
      - file-security-mirrors:/mirrors
    ports:
      - "127.0.0.1:${FILE_SECURITY_HOST_PORT:-8081}:8080"

  coordinator:
    profiles: ["runtime"]
    build:
      context: ./services/coordinator
    user: "${PUID}:${PGID}"
    depends_on:
      - sonarr
      - radarr
      - qbittorrent
      - gluetun
      - file-security
    environment:
      QBITTORRENT_URL: "http://gluetun:8080"
      QBITTORRENT_USERNAME: "${QBITTORRENT_USERNAME}"
      QBITTORRENT_PASSWORD: "${QBITTORRENT_PASSWORD}"
      QBITTORRENT_SONARR_CATEGORY: "${QBITTORRENT_SONARR_CATEGORY:-sonarr}"
      QBITTORRENT_SONARR_CATEGORY_PATH: "${QBITTORRENT_SONARR_CATEGORY_PATH:-/data/downloads/tv}"
      QBITTORRENT_RADARR_CATEGORY: "${QBITTORRENT_RADARR_CATEGORY:-radarr}"
      QBITTORRENT_RADARR_CATEGORY_PATH: "${QBITTORRENT_RADARR_CATEGORY_PATH:-/data/downloads/movies}"
      QBITTORRENT_COMPLETED_ROOT: "/data/downloads"

      FILE_SECURITY_URL: "http://file-security:8080"
      FILE_SECURITY_SAFE_STATES: "${FILE_SECURITY_SAFE_STATES:-SAFE}"
      FILE_SECURITY_BLOCK_STATES: "${FILE_SECURITY_BLOCK_STATES:-}"

      SONARR_URL: "http://sonarr:8989"
      SONARR_CONFIG_FILE: "/sonarr-config/config.xml"
      SONARR_IMPORT_MODE: "${SONARR_IMPORT_MODE:-copy}"

      RADARR_URL: "http://radarr:7878"
      RADARR_CONFIG_FILE: "/radarr-config/config.xml"
      RADARR_IMPORT_MODE: "${RADARR_IMPORT_MODE:-copy}"

      DOWNLOADS_MOUNT: "/downloads"
      COORDINATOR_STATE_FILE: "/state/state.json"
      COORDINATOR_POLL_INTERVAL_SECONDS: "${COORDINATOR_POLL_INTERVAL_SECONDS:-10}"
      COORDINATOR_HTTP_TIMEOUT_SECONDS: "${COORDINATOR_HTTP_TIMEOUT_SECONDS:-20}"
      QBITTORRENT_AUTH_RETRY_SECONDS: "${QBITTORRENT_AUTH_RETRY_SECONDS:-300}"
      COORDINATOR_DRY_RUN: "${COORDINATOR_DRY_RUN:-false}"
    volumes:
      - ./state/sonarr:/sonarr-config:ro
      - ./state/radarr:/radarr-config:ro
      - ./data/downloads:/downloads:ro
      - ./state/coordinator:/state
    restart: unless-stopped

volumes:
  gluetun-state:
  file-security-quarantine:
  file-security-logs:
  file-security-mirrors:
